services:
  pi-badge:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pi-badge-system
    restart: unless-stopped
    ports:
      - "8765:8765"
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_USER_ID=${TELEGRAM_USER_ID}
      - PI_SERVER_URL=http://localhost:8765
      - REPO_URL=${REPO_URL:-https://github.com/areyoutheregoditsmeluke/kendallmillercansuckit.git}
      - REPO_BRANCH=${REPO_BRANCH:-claude/pi-github-device-interface-vdRro}
      - REPO_PATH=/repo
      - DATA_FILE=/data/pi_messages.json
      - TRIGGER_FILE=/data/.pi_badge_poll_now
      - USB_MODE=${USB_MODE:-direct}
      - ENABLE_TELEGRAM=${ENABLE_TELEGRAM:-true}
      - ENABLE_POLLER=${ENABLE_POLLER:-true}
      - POLL_INTERVAL=${POLL_INTERVAL:-30}
    volumes:
      - badge-data:/data
      - badge-repo:/repo

volumes:
  badge-data:
  badge-repo:
